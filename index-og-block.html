<!--
  Open Graph / link preview.

  These are NOT search engine tags and they do not contradict the
  noindex above them. noindex tells an indexer not to keep the page;
  these tell Messenger, Viber, Teams and Slack what to draw when
  somebody pastes the link into a chat. Different bots, different job.

  This exists because a bare vercel.app URL pasted into a group chat
  looks exactly like a phishing link, and the people being asked to
  click it are being asked to type a payroll password on the other
  side. A title and the U.P. seal is the cheapest thing that makes it
  look like what it is.

  og:image must be an ABSOLUTE url — a relative path silently fails,
  and the failure looks like "the preview just doesn't show a picture"
  rather than like an error. Both absolute URLs below carry the
  deployment hostname, so they are the two lines to change on the day
  this moves to a domain under up.edu.ph. Nothing warns you if you
  forget; the preview simply keeps advertising the old host.

  Deliberately not described here: anything about who is paid what, or
  any wording that would read as an invitation. "Authorized personnel"
  is the whole message.
-->
<meta property="og:type"        content="website">
<meta property="og:site_name"   content="U.P. System Cash Office">
<meta property="og:title"       content="U.P. System Cash Office Integrated Web System">
<meta property="og:description" content="Secure internal portal for authorized U.P. personnel. Sign in to view your statement of account.">
<meta property="og:url"         content="https://upscoiws.vercel.app/index.html">
<meta property="og:image"       content="https://upscoiws.vercel.app/UPSeal.png">
<meta property="og:image:alt"   content="Seal of the University of the Philippines">
<meta property="og:locale"      content="en_PH">

<meta name="twitter:card"        content="summary">
<meta name="twitter:title"       content="U.P. System Cash Office Integrated Web System">
<meta name="twitter:description" content="Secure internal portal for authorized U.P. personnel.">
<meta name="twitter:image"       content="https://upscoiws.vercel.app/UPSeal.png">

<meta name="description" content="Secure internal portal for authorized U.P. personnel.">
<link rel="canonical" href="https://upscoiws.vercel.app/index.html">
